name: Bug Report
description: Report a bug or problem with the mod
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        If you are experiencing installation or usage issues, or issues that may
        have risen due to the presence of other mods, please create a Support
        issue instead!
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: The platform you are encountering the bug on
      options:
        - PCVR
        - Standalone Quest
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: Upload any log files from the mod, if possible
  - type: markdown
    attributes:
      value: >-
        If you do not know where you find your log file, follow the instructions
        below:


        ## Windows

        1. In a file explorer, go to your game's root folder. It's the folder
        that contains your Mods folder.

        2. Open the MelonLoader folder.

        3. Find the file called Latest or Latest.log.


        ## Quest

        1. In a file explorer, open the root of your Quest storage (where
        Android, Alarms, Download, etc are located).

        2. Open the MelonLoader folder, then com.StressLevelZero.BONELAB, then
        the MelonLoader folder inside of it.

        3. Find the file called Latest or Latest.log.
  - type: textarea
    id: upload
    attributes:
      label: Upload
      description: >-
        Upload any additional screenshots or videos that can help diagnose the
        bug